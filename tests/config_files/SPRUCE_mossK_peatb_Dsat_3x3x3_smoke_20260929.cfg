[machine]
machine_name = docker
modelroot_name = E3SM-Peatlands-Microbe

[simulation]
runtype = site
case_prefix = MOSSK_B_DSAT_3X3X3_SMOKE_20260929
sites = US-SPR
sitegroup = AmeriFlux
res = hcru_hcru
mettype = site
metdir = %(inputdata)s/SPRUCE_data/2024_version/plot07
use_cpl_bypass = True

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
nyears_ad = 1
nyears_final = 0
nyears_trans = 0
force_full_spinup_cycles = False
rest_option = end

[case_options]
paramfile = %(olmtdir)s/parameter_files/clm_params_Peatlands_Microbe_20260924.nc
stream_fldfilename_ndep = %(inputdata)s/lnd/clm2/ndepdata/ndep_constant_0p54_gNm2yr.nc
maxpatch_pft = 22
site_pft_fractions = 3, 36.0, 5, 14.0, 14, 25.0, 18, 25.0
use_nofire = .true.
use_humhol = .true.
use_fen_bog_drainage = .true.
use_shrub_moss_shading = .true.
use_surface_structure_shading = .false.
use_jules_peat_hydraulics = .true.
use_lch4 = .true.
use_microbe_methane = .true.
use_prognostic_moss_water = .true.
do_budgets = .false.
nyears_ad_carbon_only = 25
suplphos = 'ALL'
disable_git = True

[surface_data]
TopounitStructureShadeFrac = 0, 0, 0.0, 1, 0, 0.0, 2, 0, 0.0
TopounitStructureLightTrans = 0, 0, 1.0, 1, 0, 1.0, 2, 0, 1.0

[parameters]
microbe_methane_denitrification_rate_multiplier = 0.1

[ensemble]
parm_list = tests/ensemble/parm_list_SPR_mossK_peatb_Dsat_3x3x3_20260929.txt
ensemble_file = tests/ensemble/samples_SPR_mossK_peatb_Dsat_3x3x3_20260929.txt
nsamples = 27
np_ensemble = 9

[postprocessing]
variables = 'GPP_pft','NPP_pft','TOTVEGC_pft','H2O_MOSS_STORAGE_pft','MOSS_WATER_POTENTIAL_pft','QFLX_MOSS_SOIL_pft','ZWT_col','H2OSFC_col'
pfts = 3,5,14,18
cols = 0,1,2
frequency = annual
startyear = 1
endyear = 1
