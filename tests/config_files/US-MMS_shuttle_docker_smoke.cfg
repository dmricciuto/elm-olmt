[machine]
machine_name = docker
modelroot_name = E3SM-Peatlands-Microbe
inputdata = /inputdata

[simulation]
runtype = site
case_prefix = MMS
case_suffix = shuttle_docker_smoke
sites = US-MMS
sitegroup = Fluxnet2015
res = hcru_hcru
mettype = site
use_cpl_bypass = True

[fluxnet_shuttle]
enabled = true

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
nyears_ad = 1
nyears_final = 0
nyears_trans = 0
force_full_spinup_cycles = False

[case_options]
use_nofire = .true.
create_crop_landunit = .false.

[postprocessing]
variables = GPP
frequency = daily
startyear = 1
endyear = 1
