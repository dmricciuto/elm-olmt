[machine]
machine_name = auto
modelroot_name = E3SM-Peatlands-Microbe

[simulation]
runtype = site
case_prefix = PORTMOZ
case_suffix = microbe_cpl_bypass_smoke
sites = US-MOz
sitegroup = TES_SFA
res = hcru_hcru
mettype = site
metdir = %(inputdata)s/atm/datm7/CLM1PT_data
use_cpl_bypass = True

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
nyears_ad = 1
nyears_final = 0
nyears_trans = 0
force_full_spinup_cycles = False
rest_option = nyears
rest_n = 1

[case_options]
domainfile = %(inputdata)s/sites/US-MOz/domain.nc
surffile = %(inputdata)s/sites/US-MOz/surfdata.nc
pftdynfile = %(inputdata)s/sites/US-MOz/surfdata.pftdyn.nc
aero_file = %(inputdata)s/sites/US-MOz/aerosol.nc
stream_fldfilename_ndep = %(inputdata)s/sites/US-MOz/ndep.nc
stream_fldfilename_pdep = %(inputdata)s/sites/US-MOz/pdep.nc
stream_fldfilename_popdens = %(inputdata)s/sites/US-MOz/popdens.nc
stream_fldfilename_lightng = %(inputdata)s/sites/US-MOz/lightning.nc
paramfile = %(olmtdir)s/parameter_files/clm_params_Peatlands_Microbe_20260924.nc
site_npfts = 22
use_nofire = .true.
use_lch4 = .true.
use_microbe_methane = .true.
use_legacy_ch4_with_microbe = .false.
use_microbe_aqueous_transport = .true.
do_budgets = .false.
suplphos = 'ALL'
disable_git = True

[postprocessing]
variables = 'ZWT','DOMC_vr','MM_CH4_POREWATER','MM_SURFACE_CH4_FLUX','MM_CH4_PROD','MM_CH4_OXID','NPP','GPP','TOTVEGC'
frequency = daily
startyear = 1
endyear = 1
