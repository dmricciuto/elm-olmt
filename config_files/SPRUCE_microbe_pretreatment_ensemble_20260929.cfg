[machine]
machine_name = auto
modelroot_name = E3SM-Peatlands-Microbe
# Pathfinder and Docker paths use their machine defaults. All ensemble stages
# share one executable.

[simulation]
case_prefix = SPRMIC_PRETREAT_SOBOL512_20260929
runtype = site
sites = US-SPR
sitegroup = AmeriFlux
res = hcru_hcru
mettype = site
metdir = %(inputdata)s/SPRUCE_data/2024_version/plot07
use_cpl_bypass = True

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
nyears_ad = 150
nyears_final = 150
nyears_trans = 165
trans_startyear = 1850
force_full_spinup_cycles = True
rest_option = nyears
# Do not set rest_n: dependent stages require the terminal restart.

[case_options]
paramfile = %(olmtdir)s/parameter_files/clm_params_Peatlands_Microbe_20260924.nc
stream_fldfilename_ndep = %(inputdata)s/lnd/clm2/ndepdata/ndep_constant_0p54_gNm2yr.nc
maxpatch_pft = 22
site_pft_fractions = 3, 36.0, 5, 14.0, 14, 25.0, 18, 25.0
use_nofire = .true.
use_humhol = .true.
use_fen_bog_drainage = .true.
use_jules_peat_hydraulics = .true.
use_peatland_roots = .true.
# Deliberately exclude the experimental capillary nutrient-access mechanism
# from this calibration. Moss retains its ordinary shallow peatland root profile.
use_moss_capillary_nutrients = .false.
use_prognostic_moss_water = .true.
use_shrub_moss_shading = .true.
use_surface_structure_shading = .false.
use_lch4 = .true.
use_microbe_methane = .true.
use_c14 = .true.
use_c14_bombspike = .true.
atm_c14_filename = %(inputdata)s/atm/datm7/CO2/C14input_CMIP6_SSP245_ambient_SPRUCE_1850-2055.nc
do_budgets = .false.
nyears_ad_carbon_only = 25
suplphos = 'ALL'
disable_git = True

[surface_data]
# The boardwalk/frustum unit retains 80% of incident snow but does not shade
# the simulated ground surface. Hollow and hummock receive unmodified forcing.
TopounitStructureShadeFrac = 0, 0, 0.0, 1, 0, 0.0, 2, 0, 0.0
TopounitStructureLightTrans = 0, 0, 1.0, 1, 0, 1.0, 2, 0, 1.0
TopounitStructureSnowRetention = 0, 0, 0.8, 1, 0, 1.0, 2, 0, 1.0

[parameters]
# Member 1 in the sample file reproduces these reference settings. Density
# targets remain fixed at 20 and 90 kg C m-3 in the parameter file.
microbe_methane_denitrification_rate_multiplier = 0.1
microbe_methane_aqueous_dom_saturated_macrodispersion = 5.0e-8
decomp_depth_efolding = 0.395718086816327
dom_solubilization_anoxic_fraction = 0.5

[ensemble]
parm_list = %(olmtdir)s/ensemble/spruce_pretreatment/parm_list_SPRUCE_microbe_pretreatment_20260929.txt
ensemble_file = %(olmtdir)s/ensemble/spruce_pretreatment/samples_SPRUCE_microbe_pretreatment_sobol512_seed20260929.txt
nsamples = 512
# Pathfinder's established ensemble concurrency limit is 500. The remaining
# members are launched as scheduler capacity becomes available.
np_ensemble = 500

[postprocessing]
# TAMB is the final logical case, so these variables are collected for the
# 2015-2023 ambient validation period. Site-level output is small enough for
# daily sampling and retains seasonal profile/flux information.
variables = 'ZWT_col','H2OSFC_col','SOILLIQ_col','SOILICE_col','TSOI_col','QDRAI_col','QOVER_col','QCHARGE_col','QFLX_LAT_AQU_col','PEAT_ACROTELM_DEPTH_col','PEAT_C_DENSITY_col','PEAT_C_TARGET_DENSITY_col','PEAT_C_BURIAL_FLUX_col','CWDC_vr_col','LITR1C_vr_col','LITR2C_vr_col','LITR3C_vr_col','SOIL1C_vr_col','SOIL2C_vr_col','SOIL3C_vr_col','SOIL4C_vr_col','DOMC_vr_col','BACTERIAC_vr_col','FUNGIC_vr_col','C14_CWDC_vr_col','C14_LITR1C_vr_col','C14_LITR2C_vr_col','C14_LITR3C_vr_col','C14_SOIL1C_vr_col','C14_SOIL2C_vr_col','C14_SOIL3C_vr_col','C14_SOIL4C_vr_col','C14_DOMC_vr_col','C14_BACTERIAC_vr_col','C14_FUNGIC_vr_col','MM_DOM_POREWATER_C_col','MM_ACETATE_C_UNSAT_col','MM_ACETATE_C_SAT_col','MM_CH4_POREWATER_col','MM_CH4_POREWATER_UNSAT_col','MM_CH4_POREWATER_SAT_col','MM_CH4_PROD_col','MM_CH4_PROD_UNSAT_col','MM_CH4_PROD_SAT_col','MM_CH4_PROD_ACET_col','MM_CH4_PROD_H2_col','MM_CH4_OXID_col','MM_CH4_OXID_AER_col','MM_CH4_OXID_AOM_col','MM_SURFACE_CH4_FLUX_col','MM_CH4_SURF_DIFF_col','MM_CH4_SURF_AERE_col','MM_CH4_SURF_EBUL_col','MM_O2_STRESS_UNSAT_col','MM_O2_STRESS_SAT_col','MM_SAT_FRACTION_col','MM_NH4_POREWATER_col','MM_NO3_POREWATER_col','HR_col','NPP_pft','AGNPP_pft','BGNPP_pft','GPP_pft','TOTVEGC_pft','FROOTC_pft','FPG_col','FPG_P_col','SMINN_vr_col','SMIN_NH4_vr_col','SMIN_NO3_vr_col','GROSS_NMIN_col','ACTUAL_IMMOB_col','NET_NMIN_col','SMINN_TO_PLANT_col','F_NIT_col','F_DENIT_col','DENIT_col','SOM_N_LEACHED_col','SMIN_NO3_LEACHED_col','TOTECOSYSN_col'
pfts = 3,5,14,18
cols = 0,1,2
frequency = daily
startyear = 2015
endyear = 2023

[treatment_options]
# Run only the untreated ambient continuation. It provides a validation tail
# using the existing full-spinup/transient/treatment workflow.
nyears = 9
startdate_add_co2 = '20160301'

[treatment1]
name = TAMB
metdir = %(inputdata)s/SPRUCE_data/2024_version/plot07
add_co2 = 0
