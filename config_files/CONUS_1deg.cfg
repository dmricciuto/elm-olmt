[machine]
machine_name = cades-baseline
# This config overrides modelroot explicitly. With machine_name = auto, default
# modelroot is: Docker /code/E3SM; Pathfinder
# /projects/hpcl-cli185/proj-shared/${USER}/E3SM; local Linux
# ${HOME}/models/E3SM.
# olmtdir is the directory containing elm_olmt.py, not the launch directory.
modelroot = /gpfs/wolf2/cades/cli185/proj-shared/zdr/E3SM
# partition is only used on machines that support Slurm partitions; this
# CADES config uses queue below.
#inputdata =
#exeroot = 
queue = batch_ccsi

[simulation]
runtype = latlon_bbox
name = CONUS

lon_bounds = -125.5,-66
lat_bounds = 23,50
res = f09_f09
numproc = 640

mettype = gswp3
use_cpl_bypass = True

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
nyears_ad = 200
nyears_final = 400
nyears_trans = 164
trans_startyear = 1850
