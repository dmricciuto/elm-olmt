[machine]
machine_name = auto
modelroot_name = E3SM-Peatlands-Microbe
partition = hpcl-cli185
# Keep this test out of Pathfinder scratch, which is currently constrained.
caseroot = /projects/hpcl-cli185/users/zdr/e3sm_cases
runroot = /projects/hpcl-cli185/users/zdr/e3sm_run

[simulation]
# The one 4-km TESSFA cell nearest Marcell Experimental Forest / US-SPR:
# gridcell 12259, 47.5000 N, 93.4583 W.  This is a regional representation,
# not the bespoke three-topounit SPRUCE enclosure surface.
runtype = latlon_bbox
name = marcell_regional
case_suffix = peatlands_microbe
res = hcru_hcru
mettype = era5-daymet
metdir = %(inputdata)s/atm/datm7/Daymet_ERA5_TESSFA1/cpl_bypass_full
use_cpl_bypass = True
lon_bounds = -93.463,-93.453
lat_bounds = 47.495,47.505
numproc = 1

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
# A short, scientifically useful regional-cell smoke test before launching the
# full MN/WI/MI domain.  The final stage consumes the AD restart.
nyears_ad = 100
nyears_final = 10
nyears_trans = 0
startyear = 1980
trans_startyear = 1980
force_full_spinup_cycles = True
# Do not set rest_n: every stage must write its final restart for its successor.

[case_options]
use_nofire = .true.
use_humhol = .true.
# Unlike the SPRUCE enclosure's auxiliary lagg-like fen, this regional fen
# retains independent local drainage.
use_fen_bog_drainage = .false.
use_lch4 = .true.
use_microbe_methane = .true.
maxpatch_pft = 22
# Upland base values with peat-topounit overrides for differing column parameters.
paramfile = %(olmtdir)s/parameter_files/clm_params_Peatlands_Microbe_topounit_20261022.nc
disable_git = True

# Pre-extracted one-cell inputs from the MN/WI/MI regional product.  They retain
# the regional cell's PFT mixture, peat fraction, topounit geometry, and routing.
surffile = %(inputdata)s/lnd/clm2/surfdata_map/surfdata.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.marcell_regional_microbe_topounits.nc
domainfile = %(inputdata)s/share/domains/domain.lnd.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.marcell_regional.nc
surffile_global = %(inputdata)s/lnd/clm2/surfdata_map/surfdata.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.marcell_regional_microbe_topounits.nc
domainfile_global = %(inputdata)s/share/domains/domain.lnd.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.marcell_regional.nc

[parameters]
microbe_methane_denitrification_rate_multiplier = 0.1
microbe_methane_aqueous_dom_saturated_macrodispersion = 5.0e-9

[postprocessing]
variables = 'GPP','NPP','HR','NEE','TOTVEGC','TOTSOMC','FCH4','MM_SURFACE_CH4_FLUX','MM_CH4_PROD','MM_CH4_OXID','ZWT','ZWT_col','H2OSFC_col','QDRAI_col','QFLX_LAT_AQU_col','QFLX_LAT_AQU_LAYER_col','SOILLIQ_col','SOILICE_col','TSOI_col','MM_DOM_POREWATER_C_col','MM_ACETATE_C_UNSAT_col','MM_ACETATE_C_SAT_col','MM_CH4_POREWATER_col'
cols = 0,1,2,3
frequency = daily
startyear = 1
endyear = 110
