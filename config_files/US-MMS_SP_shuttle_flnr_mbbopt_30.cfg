[machine]
machine_name = docker
modelroot_name = E3SM-Peatlands-Microbe
inputdata = /inputdata

[simulation]
runtype = site
case_prefix = MMS_SP_SHUTTLE_FLNR_MBBOPT30
case_suffix = shuttle_1999_2023
sites = US-MMS
sitegroup = Fluxnet2015
res = hcru_hcru
mettype = site
use_cpl_bypass = True

[biogeochemistry]
nutrients = SP

[run_lengths]
# One 50-year SP run: 25-year forcing-cycle lead-in (1974-1998), then
# observed Shuttle years 1999-2023.
nyears_ad = 0
nyears_final = 50
nyears_trans = 0
trans_startyear = 1974
force_full_spinup_cycles = False

[case_options]
use_nofire = .true.
create_crop_landunit = .false.

[fluxnet_shuttle]
enabled = true

[ensemble]
parm_list = %(olmtdir)s/ensemble/us_mms_shuttle/parm_list_US-MMS_SP_flnr_mbbopt.txt
nsamples = 32
np_ensemble = 8

[calibration]
mode = single
variables = FPSN, EFLX_LH_TOT

[postprocessing]
variables = FPSN, EFLX_LH_TOT
frequency = monthly
startyear = 1999
endyear = 2023

[observations]
location = shuttle
format = table
variables = FPSN, EFLX_LH_TOT
startyear = 1999
endyear = 2023
