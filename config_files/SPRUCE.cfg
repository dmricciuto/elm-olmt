[machine]
machine_name = cades-baseline
# Set the following if you don't want to use machine defaults
modelroot = /gpfs/wolf2/cades/cli185/proj-shared/zdr/E3SM-Peatlands
inputdata = /gpfs/wolf2/cades/cli185/world-shared/e3sm/inputdata

queue = batch_ccsi

[simulation]
runtype = site
case_suffix =

# Site-specific options
sites = US-SPR
sitegroup = AmeriFlux
res = hcru_hcru
mettype = site
metdir = %(inputdata)s/SPRUCE_data/2024_version/plot07
use_cpl_bypass = True

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
nyears_ad = 50
nyears_final = 50
nyears_trans = 50
trans_startyear = 1850

[case_options]
use_nofire = .true.
humhol = .true.
pftdynfile = %(inputdata)s/SPRUCE_data/pftdyn/surfdata.pftdyn_plot07.nc
paramfile = /gpfs/wolf2/cades/cli185/proj-shared/zdr/elm-olmt/clm_params_SPRUCE_20250507.nc
#isotopes
#use_c13 = .true.
#use_c14 = .true.            
#use_c14_bombspike = .true.
#atm_c14_filename =  %(inputdata)s/atm/datm7/CO2/C14input_CMIP6_EXP2CO2_SPRUCE.nc

[postprocessing]
variables = 'NPP_pft','GPP_pft','TOTVEGC_pft','TOTVEGC_ABG_pft','FROOTC_pft','TLAI_pft','QVEGT_pft','QVEGE_pft','LEAFC_pft','AGNPP_pft','BGNPP_pft','CPOOL_pft','PLANT_NDEMAND_pft','PLANT_PDEMAND_pft','TOTSOMC','HR','ER','NEE','GPP','NPP','FSH','QSOIL','QOVER','QDRAI','QFLX_LAT_AQU','ZWT','TSOI','H2OSOI'

[treatment_options]
#global options to be applied for each treatment case
nyears = 9
startdate_add_co2 = '20160301'

#Individual treatment cases and their specific options
[treatment1]
name = TAMB
metdir   = %(inputdata)s/SPRUCE_data/2024_version/plot07
pftdynfile  = %(inputdata)s/SPRUCE_data/pftdyn/surfdata.pftdyn_plot07.nc
add_co2 = 0

