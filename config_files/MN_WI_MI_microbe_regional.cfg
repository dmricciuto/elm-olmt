[machine]
machine_name = auto
modelroot_name = E3SM-Peatlands-Microbe
partition = hpcl-cli185

[simulation]
# Full MN/WI/MI TESSFA regional domain (17,850 4-km gridcells).
runtype = latlon_bbox
name = mn_wi_mi
case_suffix = peatlands_microbe
res = hcru_hcru
mettype = era5-daymet
metdir = %(inputdata)s/atm/datm7/Daymet_ERA5_TESSFA1/cpl_bypass_full
use_cpl_bypass = True
lon_bounds = -97.25,-82.25
lat_bounds = 44.45,49.35
numproc = 128

[biogeochemistry]
nutrients = CNP
nutrient_comp = RD
soil_decomp = CTC

[run_lengths]
nyears_ad = 200
nyears_final = 400
nyears_trans = 174
trans_startyear = 1850
resubmit_years = 50
force_full_spinup_cycles = True
# Do not set rest_n: every stage must write its final restart for its successor.

[case_options]
use_nofire = .true.
use_humhol = .true.
# The regional fen is a true minerotrophic lowland, not the SPRUCE lagg-like
# auxiliary column. It therefore retains its independent local drainage.
use_fen_bog_drainage = .false.
use_lch4 = .true.
use_microbe_methane = .true.
maxpatch_pft = 22
# Upland base values with peat-topounit overrides for differing column parameters.
paramfile = %(olmtdir)s/parameter_files/clm_params_Peatlands_Microbe_topounit_20261022.nc
disable_git = True

# Install the rebuilt files at these paths under the shared inputdata tree.
# The same files can instead be referenced with absolute local paths for Docker.
surffile = %(inputdata)s/lnd/clm2/surfdata_map/surfdata.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.us_mn_wi_mi_microbe_topounits.nc
domainfile = %(inputdata)s/share/domains/domain.lnd.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.us.nc
surffile_global = %(inputdata)s/lnd/clm2/surfdata_map/surfdata.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.us_mn_wi_mi_microbe_topounits.nc
domainfile_global = %(inputdata)s/share/domains/domain.lnd.TESSFA_DOMAIN1.4km.1d.NALCMS.c260218_yw.us.nc

[parameters]
microbe_methane_denitrification_rate_multiplier = 0.1
microbe_methane_aqueous_dom_saturated_macrodispersion = 5.0e-9

[postprocessing]
# Keep regional output compact during the long spinup. Add daily column output
# only for targeted subsets or diagnostic reruns.
variables = 'GPP','NPP','HR','NEE','TOTVEGC','TOTSOMC','FCH4','MM_SURFACE_CH4_FLUX','MM_CH4_PROD','MM_CH4_OXID','ZWT'
frequency = annual
startyear = 1850
endyear = 2023
