# 512-member ambient-only SPRUCE SP hydrology calibration on Pathfinder.
# One model task per member. On the parallel/Big Loop partition,
# np_ensemble=128 uses two 64-task nodes; verify the generated Slurm script.
[machine]
machine_name = pathfinder
modelroot = /projects/hpcl-cli185/proj-shared/zdr/E3SM-Peatlands-Microbe
inputdata = /projects/hpcl-cli185/world-shared/e3sm/inputdata
runroot = /scratch/hpcl-cli185/zdr/e3sm_run
caseroot = /scratch/hpcl-cli185/zdr/e3sm_cases
# Reuse the executable validated by the two-member Pathfinder smoke test.
exeroot = /scratch/hpcl-cli185/zdr/e3sm_run/SPRSPWTSMOKE_20261028_US-SPR_ICBELMBC/bld

[simulation]
case_prefix = SPRSPWT512_20261028
runtype = site
sites = US-SPR
sitegroup = AmeriFlux
res = hcru_hcru
mettype = site
metdir = %(inputdata)s/SPRUCE_data/2024_version_noleap/plot07
use_cpl_bypass = True

[biogeochemistry]
nutrients = SP

[run_lengths]
# Each member first equilibrates in 2006-2014, then evaluates 2015-2023.
nyears_ad = 0
nyears_final = 9
nyears_trans = 0
trans_startyear = 2006
force_full_spinup_cycles = False
rest_option = end

[case_options]
paramfile = %(olmtdir)s/parameter_files/clm_params_Peatlands_SP_hydrology_20261026.nc
finidat = %(olmtdir)s/data/spruce/restarts/M126CONSISTENT_20261023_US-SPR_ICB20TRCNPRDCTCBC.elm.r.2015-01-01-00000.nc
maxpatch_pft = 22
site_pft_fractions = 3, 36.0, 5, 14.0, 14, 25.0, 18, 25.0
# Explicit fen-moss sensitivity; the bog PFT mixture remains unchanged.
spruce_fen_moss_fraction = 100.0
use_humhol = .true.
use_fen_bog_drainage = .true.
use_jules_peat_hydraulics = .true.
use_lai_streams = .true.
stream_year_first_lai = 2006
stream_year_last_lai = 2023
model_year_align_lai = 2006
stream_fldfilename_lai = %(olmtdir)s/data/spruce/lai_streams/SPRUCE_SP_LAI_TAMB.nc
use_prognostic_moss_water = .true.
use_moss_capillary_nutrients = .false.
use_surface_structure_shading = .false.
use_nofire = .true.
use_lch4 = .false.
do_budgets = .false.
disable_git = True
hist_empty_htapes = .true.
hist_nhtfrq = -24
hist_mfilt = 365
hist_dov2xy = .false.
hist_type1d_pertape = 'COLS'
hist_fincl1 = 'ZWT','H2OSFC','SOILICE','SOILLIQ','TSOI','H2OSNO','SNOWICE','SNOWLIQ','QSNOMELT','QTOPSOIL','QINFL','QCHARGE','QDRAI','QOVER','QSOIL','QVEGT','QVEGE','QFLX_LAT_AQU','RAIN','SNOW','H2O_MOSS_STORAGE','QFLX_MOSS_SOIL'

[surface_data]
TopounitStructureShadeFrac = 0, 0, 0.0, 1, 0, 0.0, 2, 0, 0.0
TopounitStructureLightTrans = 0, 0, 1.0, 1, 0, 1.0, 2, 0, 1.0
# The SPRUCE frustum removes 20% of snow reaching the auxiliary fen unit.
TopounitStructureSnowRetention = 0, 0, 0.8, 1, 0, 1.0, 2, 0, 1.0

[treatment_options]
nyears = 9

[ensemble]
parm_list = ensemble/spruce_sp_water_table/parm_list_SPRUCE_SP_ambient_WT_20261028.txt
ensemble_file = ensemble/spruce_sp_water_table/samples_SPRUCE_SP_ambient_WT_sobol512_20261028.txt
nsamples = 512
np_ensemble = 128
multi_treatment = True

[calibration]
# Use the explicit ice-aware WT objective after the ensemble, not an OLMT
# productivity surrogate. This keeps frozen and thawed errors visible.
mode = none

[treatment1]
name = TAMB
metdir = %(inputdata)s/SPRUCE_data/2024_version_noleap/plot07
stream_fldfilename_lai = %(olmtdir)s/data/spruce/lai_streams/SPRUCE_SP_LAI_TAMB.nc
